function rec(d){let a=state.active;if(!a.records[d.id])a.records[d.id]={seconds:0,running:false,startedAt:0,done:false,scores:{},marks:{},metrics:{},metricHistory:[],note:''};let r=a.records[d.id];r.metrics=r.metrics||{};r.metricHistory=r.metricHistory||[];r.events=r.events||{};r.eventHistory=r.eventHistory||[];r.rounds=r.rounds||[];r.technique=r.technique||{};return r}
function elapsed(d){let r=rec(d);return r.seconds+(r.running?Math.max(0,Math.floor((Date.now()-r.startedAt)/1000)):0)}
function drillClock(d){
 const seconds=elapsed(d),target=Math.round(plannedMinutes(d)*60);
 return target?Math.max(0,target-seconds):seconds;
}
const clock=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');

function isZoneDrill(d){return d?.type==='zone'||/^\s*1-3-1\s+zone\s+defen[sc]e\b/i.test(d?.name||'')}
function zoneAssignments(r){r.zoneAssignments=r.zoneAssignments||{};r.zoneHistory=r.zoneHistory||[];r.zoneChecks=r.zoneChecks||{};return r.zoneAssignments}

 const spots=zoneAssignments(r);if(pid&&Object.entries(spots).some(([k,v])=>k!==role&&v===pid))return false;
 const previous=spots[role]||'';if(previous===pid)return true;
 spots[role]=pid;

function rotateZone(r,ids){

 // Rotation includes every currently present player, not just the initial five.
 r.zoneRotation=(Math.max(0,Number(r.zoneRotation)||0)+1)%eligible.length;
 for(let i=0;i<ZONE_POSITIONS.length;i++){
  spots[ZONE_POSITIONS[i].key]=i<eligible.length?eligible[(r.zoneRotation+i)%eligible.length]:'';

}
function zoneEval(r,pid,cue,val){

function chronologicalSessions(){return hist().map((s,i)=>({s,i})).sort((a,b)=>String(a.s.date||'').localeCompare(String(b.s.date||''))||b.i-a.i).map(x=>x.s)}
function completedSkillMix(inputSessions){let bySkill={},totalPlanned=0,totalTimed=0,totalBlocks=0;
 inputSessions.forEach(sess=>(sess.drills||[]).forEach(d=>{let r=sess.records?.[d.id]||{};if(!r.done)return;
 const key=skillOf(d),n=Math.max(0,Number(d.minutes)||0),seconds=Math.max(0,Number(r.seconds)||0);
 if(!bySkill[key])bySkill[key]={skill:key,planned:0,timed:0,blocks:0};
 bySkill[key].planned+=n;bySkill[key].timed+=seconds;bySkill[key].blocks++;totalPlanned+=n;totalTimed+=seconds;totalBlocks++}));
 return {rows:Object.values(bySkill).sort((a,b)=>b.planned-a.planned),totalPlanned,totalTimed,totalBlocks};}
function sessionShotEvidence(inputSessions){let byDrill={};inputSessions.forEach((s,idx)=>(s.drills||[]).forEach(d=>{let r=s.records?.[d.id]||{},made=0,attempts=0;
 Object.values(r.scores||{}).forEach(v=>{if(Number(v.attempts)>0&&Number(v.made)>=0&&Number(v.made)<=Number(v.attempts)){made+=Number(v.made);attempts+=Number(v.attempts)}});
 if(!attempts)return;let k=String(d.name||'Unnamed drill');if(!byDrill[k])byDrill[k]=[];
 byDrill[k].push({date:s.date||'',sessionId:s.id,index:idx,made,attempts});}));
 return byDrill;}
function evidenceNote(type,title,evidence,action){return {type,title,evidence,action};}
function makeCoachBrief(){const last=chronologicalSessions().slice(-3),mix=completedSkillMix(last),shots=sessionShotEvidence(last),items=[];
 if(!last.length)return {last,mix,items:[evidenceNote('setup','Record your first coaching baseline','No completed sessions yet. A baseline needs recorded attempts, observations, and a saved practice.','Start with a short skill challenge and record makes/attempts.')],shotGroups:shots};
 // Same-drill comparisons only; both sessions require a minimum of 10 entered attempts.
 const candidates=Object.entries(shots).flatMap(([name,rows])=>{let series=rows.filter(r=>r.attempts>=10);if(series.length<2)return [];
 let a=series[series.length-2],b=series[series.length-1];if(a.sessionId===b.sessionId)return [];
 const delta=100*b.made/b.attempts-100*a.made/a.attempts;return [{name,a,b,delta}];}).sort((a,b)=>a.delta-b.delta);
 if(candidates.length&&Math.round(candidates[0].delta)<=-10){let c=candidates[0];items.push(evidenceNote('trend','Review '+c.name+' consistency',`${c.a.made}/${c.a.attempts} to ${c.b.made}/${c.b.attempts} across two recorded practices (−${Math.round(-c.delta)} percentage points). Small samples can fluctuate.`,`Repeat the same ${c.name} challenge with comparable attempts.`));}
 // Only count focus flags from completed drills in the last three sessions; not player diagnoses.
 let focusBySkill={};last.forEach(sess=>(sess.drills||[]).forEach(d=>{let r=sess.records?.[d.id]||{};if(!r.done)return;let count=Object.values(r.marks||{}).filter(v=>v==='focus').length;if(!count)return;let k=skillOf(d);if(!focusBySkill[k])focusBySkill[k]={count:0,sessions:new Set()};focusBySkill[k].count+=count;focusBySkill[k].sessions.add(sess.id);}));
 const repeated=Object.entries(focusBySkill).filter(([k,v])=>v.sessions.size>=2&&v.count>=2).sort((a,b)=>b[1].count-a[1].count);
 if(repeated.length){let [area,v]=repeated[0];items.push(evidenceNote('observations','Revisit '+area+' coaching points',`${v.count} focus observations were entered during completed ${area} drills across ${v.sessions.size} practices. These are coach notes, not skill ratings.`,`Add a ${area} drill and record a specific measurable result.`));}
 if(candidates.length){let positives=candidates.filter(c=>c.delta>=10).sort((a,b)=>b.delta-a.delta);
 if(positives.length){let c=positives[0];items.push(evidenceNote('progress','Recheck '+c.name+' progress',`${c.a.made}/${c.a.attempts} to ${c.b.made}/${c.b.attempts} in matched drill records (+${Math.round(c.delta)} percentage points). This is an observed change, not proof of lasting improvement.`,`Repeat the drill to confirm the trend.`));}}
 if(mix.totalPlanned>0){let main=mix.rows[0];items.push(evidenceNote('workload','Review your practice balance',`${main.skill} accounts for ${main.planned} of ${mix.totalPlanned} scheduled minutes in completed drill blocks over the last ${last.length} practice${last.length===1?'':'s'}.`,`Compare the skill mix with your next game or development goals.`));}
 let comparable=Object.values(shots).some(rows=>new Set(rows.map(r=>r.sessionId)).size>=2);
 if(!comparable){
  const baseline=Object.entries(shots).map(([name,rows])=>({name,...rows[rows.length-1]})).sort((a,b)=>b.attempts-a.attempts)[0];
  items.push(baseline?evidenceNote('baseline','Build on your shooting baseline',baseline.name+' · '+baseline.made+'/'+baseline.attempts+' made on '+baseline.date+'.','Repeat the same drill and record the results the same way.'):evidenceNote('baseline','Collect a shooting baseline','There are no recorded shooting attempts yet.','Record makes and attempts in one shooting drill.'));
 }
 if(!mix.totalBlocks){items.push(evidenceNote('coverage','Complete and log your drills','Your recent sessions do not contain completed drill blocks; scheduled plans alone do not establish actual training workload.','Mark drills complete during the next practice.'));}
 if(items.length<2)items.push(evidenceNote('planning','Plan a measurable next practice',`${last.length} saved practice${last.length===1?'':'s'} reviewed. Specific shooting and focus suggestions appear when repeated evidence is available.`,'Choose one repeatable benchmark for the next session.'));
 return {last,mix,items:items.slice(0,4),shotGroups:shots};}
function briefPage(){const brief=makeCoachBrief();let out='<div class="coach-section"><strong>COACH BRIEF · LAST '+brief.last.length+' PRACTICE'+(brief.last.length===1?'':'S')+'</strong><p class="small muted">Evidence-based coaching prompts. This is not an AI prediction, a player grade, or a claim of causation.</p></div>';
 out+='<div class="section"><h3>Next practice priorities</h3><span class="pill">REVIEW</span></div>';
 out+=brief.items.map((o,i)=>`<div class="brief-card"><div class="row start"><span class="brief-number">${i+1}</span><div class="grow"><h3>${safe(o.title)}</h3><div class="evidence">${safe(o.evidence)}</div><p style="margin-top:9px"><strong>Try next:</strong> ${safe(o.action)}</p></div></div></div>`).join('');
 out+=`<div class="coach-brief-actions">${bt('Open practice builder →','edit-plan','outline')}${bt('See team data','analytics-team','ghost')}</div>`;
 out+='<div class="section"><h3>Recent completed-drill workload</h3></div><div class="card">';
 const mix=brief.mix;if(!mix.totalPlanned)out+=empty('Scheduled minutes unavailable',mix.totalBlocks?mix.totalBlocks+' completed drill blocks have no scheduled durations.':'Complete a drill to log workload.');
 else out+=`<p class="small muted">${mix.totalPlanned} scheduled minutes in ${mix.totalBlocks} completed drill blocks. Timers logged ${Math.round(mix.totalTimed/60)} minutes separately.</p>`+mix.rows.map(x=>focusBar(x.skill,x.planned,mix.totalPlanned)).join('');
 out+='</div><div class="note">Older named library drills are categorized by their known drill names. Custom or unmatched drills appear as Uncategorized until you assign a skill area in Plans. Suggestions use the last three saved sessions only.</div>';return out;}
function focusBar(name,minutes,total){return `<div class="focus-table"><span class="focus-label">${safe(name)}</span><div class="focus-meter"><div style="width:${total?100*minutes/total:0}%"></div></div><span class="focus-min">${minutes}m</span></div>`}
function individualAnalysis(selected){let events=selected.trend.slice().reverse();let names=[...new Set(events.map(e=>e.name))].sort();let selectedName=state.playerDrillFilter==='all'?'all':names.includes(state.playerDrillFilter)?state.playerDrillFilter:'all';
 let items=selectedName==='all'?events:events.filter(x=>x.name===selectedName);
 let out='<div class="section"><h3>Comparable shooting trends</h3></div><div class="card"><p class="muted small">Use one drill at a time to track change. Rates reflect only entered attempts.</p><label class="field" for="player-drill-filter">Drill filter</label><select id="player-drill-filter"><option value="all" '+(selectedName==='all'?'selected':'')+'>All recorded drills (no combined trend)</option>'+names.map(n=>`<option value="${safe(n)}" ${selectedName===n?'selected':''}>${safe(n)}</option>`).join('')+'</select>';
 if(selectedName!=='all'){let sameChrono=selected.trend.filter(x=>x.name===selectedName);let n=sameChrono.length;if(n>=2){let a=sameChrono[n-2],b=sameChrono[n-1];let d=100*b.made/b.attempts-100*a.made/a.attempts;
 if(a.attempts>=5&&b.attempts>=5){out+=`<div class="coach-section"><strong>Most recent two results: ${d>0?'+':''}${Math.round(d)} percentage points</strong><div class="rnote">${a.made}/${a.attempts} on ${safe(a.date)} → ${b.made}/${b.attempts} on ${safe(b.date)}. Descriptive change only; small samples fluctuate.</div></div>`;}else out+='<div class="notice">Two drill entries exist, but both need at least five attempts before showing a comparison.</div>';}else out+='<div class="notice">Add another session with this same drill to see a comparison.</div>';}
 out+=items.length?items.map(e=>progress(`${e.date} · ${e.name}`,e.made,e.attempts,`(${e.made}/${e.attempts})`)).join(''):empty('No shooting records','Log shots during a completed practice.');
 if(selectedName==='all'&&names.length>1)out+='<p class="rnote">Different shooting drills are displayed separately. Select a drill to compare like-for-like results.</p>';
 out+='</div>';return out;}
function individualObservationLog(selected){let events=[];chronologicalSessions().forEach(sess=>(sess.drills||[]).forEach(d=>{let r=sess.records?.[d.id]||{},mark=r.marks?.[selected.player.id];if(mark==='focus'||mark==='good')events.push({date:sess.date,drill:d.name,mark});}));
 let out='<div class="section"><h3>Coach observations</h3></div><div class="card">';
 out+=events.length?events.slice(-10).reverse().map(e=>`<div class="note-record"><span class="chipbox ${e.mark==='focus'?'focus':''}">${e.mark==='focus'?'Focus note':'Positive note'}</span><strong class="small" style="margin-left:7px">${safe(e.drill)}</strong><div class="rnote">${safe(e.date)}</div></div>`).join(''):empty('No individual observations','Use Good or Focus during a live drill to record coaching notes.');
 out+='</div><div class="note">These are private coach observations—not diagnoses, rankings, or objective skill measurements. Use a consistent drill to compare performance.</div>';return out;}


const GAME_FIELDS=['twoMade','twoAtt','threeMade','threeAtt','ftMade','ftAtt','oreb','dreb','ast','stl','blk','tov','pf'];
const GAME_BUTTONS=[['2pt +','two-make'],['2pt miss','two-miss'],['3pt +','three-make'],['3pt miss','three-miss'],['FT +','ft-make'],['FT miss','ft-miss'],['Off. reb','oreb'],['Def. reb','dreb'],['Assist','ast'],['Steal','stl'],['Block','blk'],['Turnover','tov'],['Foul','pf']];
function freshBox(){return Object.fromEntries(GAME_FIELDS.map(k=>[k,0]))}
function fixBox(v){let b=freshBox();GAME_FIELDS.forEach(k=>{b[k]=Math.max(0,Number(v?.[k])||0)});return b}
function points(b){return 2*(Number(b.twoMade)||0)+3*(Number(b.threeMade)||0)+(Number(b.ftMade)||0)}
function sumGameBox(box){let b=freshBox();Object.values(box||{}).forEach(p=>GAME_FIELDS.forEach(k=>{b[k]+=Number(p?.[k])||0}));return b}
function gameMoves(field){
 if(field==='two-make')return [['twoMade',1],['twoAtt',1]];
 if(field==='two-miss')return [['twoAtt',1]];
 if(field==='three-make')return [['threeMade',1],['threeAtt',1]];
 if(field==='three-miss')return [['threeAtt',1]];
 if(field==='ft-make')return [['ftMade',1],['ftAtt',1]];
 if(field==='ft-miss')return [['ftAtt',1]];
 return GAME_FIELDS.includes(field)&&!['twoMade','twoAtt','threeMade','threeAtt','ftMade','ftAtt'].includes(field)?[[field,1]]:null;
}
function gameStatsLine(b){let row=fixBox(b);return points(row)+' PTS · '+(row.oreb+row.dreb)+' REB · '+row.ast+' AST · '+row.stl+' STL · '+row.tov+' TO'}
function gameScoreLine(g){if(g.teamScore===null||g.teamScore===undefined||g.opponentScore===null||g.opponentScore===undefined)return 'Final score not entered';let a=Number(g.teamScore),b=Number(g.opponentScore);return a+'–'+b+' · '+(a>b?'Win':a<b?'Loss':'Tie')}
function teamGames(){return (state.games||[]).filter(g=>g.teamId===state.teamId&&!g.scheduled).slice().reverse()}
function scheduledGames(){return state.games.filter(g=>g.teamId===state.teamId&&g.scheduled).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))}

// The private user-specific practice data is supplied in the URL fragment by the coach.

async function receivePrivatePracticeLink(){
 const prefix='#celtics-practice=';
 const hash=window.location?.hash||'';
 if(!hash.startsWith(prefix))return;
 const encoded=hash.slice(prefix.length);
 // Erase the sensitive fragment from the address bar/history before processing.
 try{window.history?.replaceState(null,'',window.location.pathname+window.location.search);}catch(e){}
 try{
  if(!encoded||encoded.length>30000||!/^[A-Za-z0-9_-]+$/.test(encoded))throw Error('This practice link is invalid');
  if(typeof DecompressionStream!=='function')throw Error('This browser cannot unpack the private practice link. Use the JSON file import instead.');
  const base64=encoded.replace(/-/g,'+').replace(/_/g,'/');
  const bytes=Uint8Array.from(atob(base64.padEnd(Math.ceil(base64.length/4)*4,'=')),c=>c.charCodeAt(0));
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const raw=await new Response(stream).text();
  const payload=JSON.parse(raw);
  if(payload.format!=='coachhq_patch_a_import_v1'||payload.practice?.importKey!=='celtics-2026-11-23-practice-3')throw Error('Unexpected private practice package');
  const matched=state.teams.find(x=>normalizeName(x.name)===normalizeName(payload.team));
  if(!matched)throw Error('The Celtics team is missing. Create or select the team first.');
  state.teamId=matched.id;
  validatePracticeImport(payload,matched,true);
  const exists=importCollision(payload,matched);
  let added=0;
  if(!exists){importPracticePayload(payload);added=1;}
  const removed=removeUntouchedExamplePlan();
  // Honor a saved Practice #4 when it already exists, without duplicating it.
  const next=importPlanCollision(payload,matched);
  if(next)state.planId=next.id;
  state.analyticsMode='history';state.tab='analytics';state.recap=exists?.id||state.recap;
  state.importNotice=added
   ?'Monday, November 23 Practice #3 imported with real player results. '+(removed?'Untouched starter example removed.':'Your existing plans were preserved.')
   :'Monday Practice #3 is already on this device. '+(removed?'Untouched starter example removed.':'No duplicate data was imported.');
  save();render();
  toast(added?'Actual Practice #3 imported':'Actual practice already on this device');
 }catch(err){
  state.importNotice='Private practice link could not be imported: '+(err?.message||'Unknown error')+'. No starter plan was removed.';
  state.analyticsMode='history';state.tab='analytics';save();render();
  toast('Import unsuccessful — check message in Insights');
 }
}

 chronologicalSessions().forEach(sess=>(sess.drills||[]).forEach(d=>{
 if(d.type!=='form3'||d.phase!=='extra')return;let r=sess.records?.[d.id];if(!r)return;

const METRIC_GROUPS={
 star:['Star Passing · layup finishing','Finishing'],
 form3:['Form Shooting · official','Shooting'],
 ftRounds:['Free Throws','Shooting'],
 twoBall:['Two-Ball Handling · clean reps','Ball Security'],
 layups:['Full-Court Layups · finishing','Finishing'],
 cp3layup:['CP3 Triangle · layups','Finishing'],
 cp3jumper:['CP3 Triangle · jump shots','Shooting'],
 rebound:['Box-Out · successful reps','Rebounding']
};
function countActual(n){return Number.isFinite(Number(n))&&n!==null&&n!==undefined?Math.max(0,Number(n)):0}
function sessionMetricRows(sess,pid){
 const byKey={};
 function add(key,label,category,made,attempts){
  made=Number(made);attempts=Number(attempts);
  if(!Number.isFinite(made)||!Number.isFinite(attempts)||attempts<=0||made<0||made>attempts)return;
  let row=byKey[key]||(byKey[key]={key,label,category,made:0,attempts:0});
  row.made+=made;row.attempts+=attempts;
 }
 for(const d of sess.drills||[]){
  const r=sess.records?.[d.id]||{};
  if(d.type==='form3'){
   if(d.phase==='extra'||d.phase==='pre')continue;
   let made=0,attempts=0;
   for(const round of r.rounds||[])for(const [player,positions] of Object.entries(round.locations||{})){
    if(pid&&player!==pid)continue;
    for(const loc of FORM_LOCS){let v=positions[loc];if(v===null||v===undefined)continue;
     let n=Number(v);if(!Number.isInteger(n)||n<0||n>5)continue;made+=n;attempts+=5;}
   }
   add('form3',...METRIC_GROUPS.form3,made,attempts);
   continue;
  }
  if(d.type==='ftRounds'){
   let made=0,attempts=0;
   for(const round of r.rounds||[])for(const [player,v] of Object.entries(round.results||{})){
    if(pid&&player!==pid||v.made==null||v.attempts==null)continue;
    const m=Number(v.made),a=Number(v.attempts);
    if(!Number.isInteger(m)||!Number.isInteger(a)||m<0||a<=0||m>a)continue;
    made+=m;attempts+=a;
   }
   add('ftRounds',...METRIC_GROUPS.ftRounds,made,attempts);continue;
  }
  let key=d.type,parts=[];
  if(key==='star')parts=[['star','lm','lx']];
  else if(key==='twoBall')parts=[['twoBall','clean','failed']];
  else if(key==='layups')parts=[['layups','made','miss']];
  else if(key==='rebound')parts=[['rebound','box','noBox']];
  else if(key==='cp3')parts=[['cp3layup','lm','lx'],['cp3jumper','jm','jx']];
  else if(key==='shots'){
   let made=0,attempts=0;for(const [player,v] of Object.entries(r.scores||{})){
    if(pid&&player!==pid||v?.made==null||v?.attempts==null)continue;
    const m=Number(v.made),a=Number(v.attempts);if(!Number.isInteger(m)||!Number.isInteger(a)||m<0||a<=0||m>a)continue;made+=m;attempts+=a;
   }
   const label=d.name||'Legacy Shooting',id='legacy-shot:'+label.trim().toLowerCase();
   add(id,label+' · shots','Shooting',made,attempts);continue;
  }else continue;
  for(const [which,madeKey,missedKey] of parts){
   let made=0,attempts=0;
   for(const [player,v] of Object.entries(r.events||{})){
    if(pid&&player!==pid)continue;
    let m=countActual(v?.[madeKey]),miss=countActual(v?.[missedKey]);
    made+=m;attempts+=m+miss;
   }
   add(which,...METRIC_GROUPS[which],made,attempts);
  }
 }
 return Object.values(byKey);
}
function comparedMetrics(pid=null,limit=4){
 const rows={};
 chronologicalSessions().forEach(sess=>{
  sessionMetricRows(sess,pid).forEach(metric=>{
   let result=rows[metric.key]||(rows[metric.key]={key:metric.key,label:metric.label,category:metric.category,sessions:[]});
   result.sessions.push({id:sess.id,title:sess.title,date:sess.date,made:metric.made,attempts:metric.attempts});
  });
 });
 return Object.values(rows).filter(row=>row.sessions.length).map(row=>{
  row.sessions=row.sessions.slice(-limit);row.latest=row.sessions[row.sessions.length-1];
  row.previous=row.sessions.length>=2?row.sessions[row.sessions.length-2]:null;
  row.deltaPoints=row.previous?(100*row.latest.made/row.latest.attempts-100*row.previous.made/row.previous.attempts):null;
  return row;
 }).sort((a,b)=>(b.latest.date||'').localeCompare(a.latest.date||'')||a.label.localeCompare(b.label));
}
function metricComparisonHTML(row,compact=false){
 let latest=row.latest,previous=row.previous;
 const delta=row.deltaPoints===null?'Only one recorded practice':(row.deltaPoints>0?'+':'')+row.deltaPoints.toFixed(1)+' percentage points vs previous';
 let last='<div class="row"><strong class="grow">'+safe(row.label)+'</strong><span class="pill">'+safe(percent(latest.made,latest.attempts))+'</span></div>'+
 '<div class="rnote">'+safe(latest.date)+' · '+latest.made+'/'+latest.attempts+' made/attempts · '+safe(delta)+'</div>';
 if(previous)last+='<div class="rnote">Previous: '+safe(previous.date)+' · '+previous.made+'/'+previous.attempts+' ('+safe(percent(previous.made,previous.attempts))+')</div>';
 if(!compact)last+='<div class="trend-rows">'+row.sessions.map(v=>'<div class="trend-row"><span>'+safe(v.date)+'</span><div class="trend-bar"><div style="width:'+Math.min(100,100*v.made/v.attempts).toFixed(1)+'%"></div></div><span>'+safe(percent(v.made,v.attempts))+' <small>('+v.made+'/'+v.attempts+')</small></span></div>').join('')+'</div>';
 return '<div class="hintrow">'+last+'</div>';
}
function practiceTrendsHTML(pid=null){
 const all=comparedMetrics(pid),repeats=all.filter(r=>r.sessions.length>=2);
 let out='<div class="section"><h3>'+(pid?'Player skill progress':'Team drill progress')+'</h3><span class="pill">'+repeats.length+' REPEATED DRILLS</span></div>';
 out+='<div class="card"><p class="muted small">Only comparable recorded drill outcomes appear. Zero makes with attempts is real data; missing attempts are excluded. Changes are percentage points, not a player rating.</p>';
 if(!all.length)return out+empty('No comparable drill data yet','Record makes and attempts across practices to begin tracking progress.')+'</div>';
 out+=all.slice(0,9).map(r=>metricComparisonHTML(r)).join('')+
 '<p class="rnote">Small samples and different coaching conditions can change percentages. These observations do not establish a trend in underlying player ability.</p></div>';
 return out;
}

function recommendedPracticeDrills(){
 let result=new Map();
 const add=(name,reason,source)=>{
  if(!library.some(x=>x[0]===name))return;
  if(!result.has(name))result.set(name,{name,reasons:[],sources:[],source});
  let row=result.get(name);
  if(!row.reasons.includes(reason))row.reasons.push(reason);
  if(!row.sources.includes(source))row.sources.push(source);
 };
 // Coach-authored goals are higher priority than inferred statistics.
 let areas=new Map();
 for(const player of t().players)for(const goal of player.development||[]){
  if(goal.status==='completed')continue;
  const name=DEVELOPMENT_DRILLS[goal.area];if(!name)continue;
  const key=goal.area+'|'+name;
  areas.set(key,{area:goal.area,name,players:new Set([...(areas.get(key)?.players||[]),player.id])});
 }
 for(const item of areas.values())add(item.name,'Coach goal: '+item.area+' · '+item.players.size+' player(s) flagged','coach-set');
 for(const metric of comparedMetrics()){
  const cfg=STAT_BASELINE_REVIEWS[metric.key];if(!cfg)continue;
  const row=metric.latest,rate=100*row.made/row.attempts;
  if(row.attempts>=cfg.minimum&&rate<cfg.threshold){
   add(cfg.name,'Recorded '+row.made+'/'+row.attempts+' ('+percent(row.made,row.attempts)+') on '+row.date+' · '+cfg.why,'stat-review');
  }
 }
 return [...result.values()].slice(0,9);
}

function automaticRoles(){
 const sessions=chronologicalSessions().slice(-6),games=teamGames().slice(0,6);
 const entries=t().players.flatMap(player=>{
  const practice=boardCell(sessions.flatMap(session=>sessionMetricRows(session,player.id).filter(row=>['form3','ftRounds','star'].includes(row.key))));
  const gameLines=games.flatMap(game=>game.box?.[player.id]?[fixBox(game.box[player.id])]:[]);
  const shots=gameLines.reduce((sum,line)=>sum+line.twoAtt+line.threeAtt+line.ftAtt,0);
  const makes=gameLines.reduce((sum,line)=>sum+line.twoMade+line.threeMade+line.ftMade,0);
  const practiceScore=practice.attempts>=10?practice.rate:null,gameScore=shots>=10?makes/shots:null;
  if(practiceScore===null&&gameScore===null)return [];
  const score=practiceScore===null?gameScore:gameScore===null?practiceScore:.4*practiceScore+.6*gameScore;
  return [{id:player.id,score,practice,shots,makes,practiceScore,gameScore}];
 });
 entries.sort((a,b)=>b.score-a.score);
 return new Map(entries.map(entry=>{
  const place=entries.findIndex(other=>other.score===entry.score);
  const role=place<5?'Starter':place===5?'Sixth Man':place<8?'Rotation':'Bench';
  const evidence=[entry.practiceScore!==null?'Practice '+entry.practice.made+'/'+entry.practice.attempts:null,entry.gameScore!==null?'Games '+entry.makes+'/'+entry.shots:null].filter(Boolean).join(' · ');
  return [entry.id,{role,evidence}];
 }));
}

function inBoardDates(date){
 return (!boardChoices.from||date>=boardChoices.from)&&(!boardChoices.to||date<=boardChoices.to);
}
function boardCell(results){
 const attempts=results.reduce((sum,row)=>sum+row.attempts,0);

}
function boardChange(cell,previous,recent){

}

 });

 for(const [key] of boardMetrics){

 return out+'<div class="board-scroll" tabindex="0" aria-label="Player comparison table"><table class="team-board"><thead><tr><th scope="col">Player</th><th scope="col">Coach tier / role</th>'+

 '<th scope="col">Change</th></tr></thead><tbody>'+players.map(({player,cells,change})=>'<tr><th scope="row">'+safe(player.name)+'</th><td>'+profile(player,'coachTier','Tier',coachTiers)+(roles.has(player.id)?'<strong>'+roles.get(player.id).role+'</strong><p class="rnote">'+roles.get(player.id).evidence+'</p>':'<span class="rnote">Role pending · needs more data</span>')+'</td>'+

 }).join('')+'<td>'+(change?change.before.made+'/'+change.before.attempts+' → '+change.after.made+'/'+change.after.attempts+' · '+(change.delta>0?'+':'')+change.delta.toFixed(1)+' pts':'More data needed')+'</td></tr>').join('')+'</tbody></table></div>';

function historyCorrection(el){

 if(!sess||!d)throw Error('Saved practice not found');
 let r=sess.records[d.id]=sess.records[d.id]||{},kind=el.dataset.kind,pid=el.dataset.player,key=el.dataset.key,index=Number(el.dataset.round||0);
 let value=el.value===''?null:Number(el.value),max=kind==='form'?5:9999;
 if(value!==null&&(!Number.isInteger(value)||value<0||value>max))throw Error('Invalid result: enter a whole number from 0 to '+max);
 let obj;
 if(kind==='event'){r.events=r.events||{};obj=r.events[pid]=r.events[pid]||{};}
 else if(kind==='score'){r.scores=r.scores||{};obj=r.scores[pid]=r.scores[pid]||{};}
 else if(kind==='form'){if(!r.rounds?.[index])throw Error('Round missing');let round=r.rounds[index];round.locations=round.locations||{};obj=round.locations[pid]=round.locations[pid]||{};}
 else if(kind==='ft'){if(!r.rounds?.[index])throw Error('Round missing');let round=r.rounds[index];round.results=round.results||{};obj=round.results[pid]=round.results[pid]||{};}
 else throw Error('Unknown result field');
 let old=obj[key]??null;if(old===value)return false;obj[key]=value;
 r.corrections=r.corrections||[];r.corrections.push({at:new Date().toISOString(),kind,key,pid,round:kind==='form'||kind==='ft'?index:null,old,new:value});
 if(d.type==='form3'&&d.phase!=='extra')r.scores=formRoundPlayerSums(r);
 if(d.type==='ftRounds')r.scores=ftRoundPlayerSums(r);
 if(d.type==='star'){let ev=r.events?.[pid]||{},made=Number(ev.lm)||0,miss=Number(ev.lx)||0;r.scores=r.scores||{};if(made+miss>0)r.scores[pid]={made,attempts:made+miss};else delete r.scores[pid];}
 save();return true;
}
function summarizeDrills(sess){

 (sess.drills||[]).forEach(d=>{
 let r=sess.records?.[d.id]||{};
 if(d.type==='star')Object.values(r.events||{}).forEach(v=>{stats.star[0]+=Number(v.lm)||0;stats.star[1]+=(Number(v.lm)||0)+(Number(v.lx)||0);});
 if(d.type==='twoBall')Object.values(r.events||{}).forEach(v=>{stats.ball[0]+=Number(v.clean)||0;stats.ball[1]+=(Number(v.clean)||0)+(Number(v.failed)||0);});
 if(d.type==='form3')(r.rounds||[]).forEach(round=>Object.values(round.locations||{}).forEach(v=>FORM_LOCS.forEach(k=>{if(v[k]===null||v[k]===undefined)return;let dest=d.phase==='extra'?stats.extra:stats.form;dest[0]+=Number(v[k])||0;dest[1]+=5;if(d.phase!=='extra'){stats.locations[k][0]+=Number(v[k])||0;stats.locations[k][1]+=5;}})));
 if(d.type==='ftRounds')(r.rounds||[]).forEach(round=>Object.values(round.results||{}).forEach(v=>{if(v.made===null||v.made===undefined||v.attempts===null||v.attempts===undefined)return;stats.ft[0]+=Number(v.made)||0;stats.ft[1]+=Number(v.attempts)||0;}));
 });
 return stats;
}

 e.textContent=clock(seconds);

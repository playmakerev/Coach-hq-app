<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c392b"><meta name="apple-mobile-web-app-capable" content="yes"><title>Coach HQ V3.1 — Coaching Intelligence & Practice Tracker</title>
<style>
:root{--forest:#0b382b;--green:#0b7548;--mint:#e9f5ec;--bg:#f3f7f3;--ink:#183129;--muted:#6e8579;--line:#deeadf;--red:#ab5244}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}input,select,textarea{width:100%;background:#fff;color:var(--ink);border:1px solid #ceddd1;border-radius:10px;padding:11px;font-size:16px}textarea{min-height:78px;resize:vertical}h1{font-size:28px;letter-spacing:-.8px;line-height:1.1;margin:7px 0}h2{font-size:18px;letter-spacing:-.4px;margin:0}h3{font-size:15px;margin:0}p{margin:6px 0 11px}.muted{color:var(--muted)}.small{font-size:12px}.xs{font-size:10px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:1.1px;text-transform:uppercase;color:var(--green)}.shell{max-width:760px;margin:auto;padding:16px 15px 110px}.header{background:var(--forest);color:white;position:sticky;top:0;z-index:5;padding:calc(12px + env(safe-area-inset-top)) 16px 13px}.headerin{max-width:760px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{display:flex;align-items:center;gap:10px}.mark{display:grid;place-items:center;background:#1b6648;border-radius:11px;width:36px;height:36px;font-size:20px}.brand strong{font-size:16px;letter-spacing:-.4px}.brand small{display:block;color:#c0decb;font-size:11px}.btn{background:var(--green);color:#fff;border-radius:11px;min-height:42px;padding:10px 12px;font-size:13px;font-weight:800;display:inline-flex;justify-content:center;align-items:center;gap:6px;text-align:center}.btn:disabled{opacity:.4;cursor:not-allowed}.btn.ghost{color:var(--green);background:#e7f4e9}.btn.outline{color:var(--green);background:white;border:1px solid #b9d9c2}.btn.warn{color:var(--red);background:#ffefeb}.btn.dark{background:var(--forest)}.btn.sm{font-size:11px;min-height:31px;padding:7px 9px;border-radius:8px}.btn.full{width:100%}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px;margin:11px 0;box-shadow:0 2px 9px #3150380c}.hero{background:linear-gradient(135deg,#0d3d30,#167b52);color:white;border-radius:19px;padding:23px 19px;margin:8px 0 16px}.hero .eyebrow{color:#b4e6c3}.hero p{color:#d3ead9}.row{display:flex;justify-content:space-between;align-items:center;gap:9px}.row.wrap{flex-wrap:wrap}.row.start{align-items:flex-start}.grow{flex:1;min-width:0}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.metric{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px}.metric b{display:block;font-size:24px;letter-spacing:-.7px}.metric small{color:var(--muted);font-size:10px;font-weight:850}.section{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:19px 0 9px}.pill{font-size:10px;color:var(--green);background:#dff0e4;padding:5px 8px;border-radius:999px;font-weight:850}.pill.gold{color:#8d6b19;background:#fff2d0}.line{border-top:1px solid #e7eee7;margin:12px 0}.listrow{display:flex;align-items:center;gap:10px;padding:11px 0}.listrow+.listrow{border-top:1px solid #edf1ed}.avatar{width:36px;height:36px;border-radius:50%;background:#e6f4e9;display:grid;place-items:center;color:#09633e;font-size:11px;font-weight:900;flex-shrink:0}.num{width:34px;height:34px;border-radius:10px;background:#edf3ed;display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--green);flex-shrink:0}.rnote{font-size:11px;color:var(--muted);margin-top:3px}.ctrls{display:flex;gap:5px;flex-wrap:wrap}.choice{padding:8px 9px;border:1px solid #d5e4d6;color:#698273;background:#fff;border-radius:9px;font-size:11px;font-weight:850;min-height:32px}.choice.on{color:#fff;background:var(--green);border-color:var(--green)}.choice.out.on{background:#ae5142;border-color:#ae5142}.choice.late.on{background:#b88a28;border-color:#b88a28}.choice.excused.on{background:#637aa0;border-color:#637aa0}.field{display:block;font-size:11px;font-weight:850;margin:10px 0 5px}.empty{padding:20px 12px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--ink);margin-bottom:5px}.tabbar{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:center;border-top:1px solid var(--line);z-index:8;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -4px 14px #183b2d10}.tabin{display:flex;width:100%;max-width:760px}.tabin button{flex:1;background:transparent;color:#829487;display:flex;flex-direction:column;gap:3px;align-items:center;padding:9px 2px;font-weight:850;font-size:10px;min-width:0}.tabin button span{font-size:20px}.tabin button.on{color:var(--green)}.clock{font-size:46px;letter-spacing:-2px;font-variant-numeric:tabular-nums;font-weight:900;line-height:1.1}.timer{background:var(--forest);color:white;border-radius:15px;text-align:center;padding:23px 12px}.timer .muted{color:#b6d5c3}.progress{height:8px;background:#e4eee5;border-radius:99px;overflow:hidden}.progress>div{height:100%;background:#16a86a}.score{min-width:45px;text-align:center;font-weight:900;font-variant-numeric:tabular-nums}.footer{font-size:11px;text-align:center;color:#7f9285;margin:24px 4px}.notice{background:#fff3d8;border-radius:12px;padding:12px;color:#755a22;font-size:12px;margin:10px 0}.note{background:#ecf7ee;border-radius:12px;padding:12px;color:#567362;font-size:12px;margin:9px 0}.actions{display:flex;gap:7px}.actions>*{flex:1}.toast{display:none;position:fixed;bottom:82px;left:50%;transform:translateX(-50%);z-index:30;background:var(--forest);color:white;padding:12px 17px;border-radius:11px;font-weight:800;box-shadow:0 4px 25px #0004;min-width:145px;text-align:center}.tag{display:inline-block;font-weight:850;font-size:10px;color:var(--green)}@media(max-width:370px){.choice{padding:7px 6px;font-size:10px}.avatar{width:30px;height:30px}.shell{padding-left:10px;padding-right:10px}.listrow{gap:6px}}@media(min-width:720px){.metric b{font-size:29px}.shell{padding-top:22px}}

/* Coach HQ V2 extensions */
.v2mark{font-size:9px;background:#285844;color:#d0f1de;border-radius:6px;font-weight:900;padding:4px 6px;margin-left:4px}.profile-head{display:flex;align-items:center;gap:12px}.subtabs{display:flex;gap:7px;margin:12px 0;overflow:auto}.subtabs button{padding:10px 13px;border:1px solid #cde4d2;border-radius:99px;color:#4d7160;background:white;font-size:12px;font-weight:800;white-space:nowrap}.subtabs button.active{background:#0b7548;color:white;border-color:#0b7548}.trendrow{margin:12px 0}.trendlabel{font-size:12px;color:#667e70;display:flex;justify-content:space-between;margin-bottom:5px}.miniBar{height:9px;border-radius:99px;background:#e8eee9;overflow:hidden}.miniBar i{display:block;height:100%;background:#159764;border-radius:99px;min-width:0}.miniBar.gold i{background:#bc8a32}.hintrow{padding:10px 0;border-top:1px solid #e8eee9}.hintrow:first-child{border-top:0}.drill-edit{border:1px solid #bde0c7;background:#f1faf4;border-radius:14px;padding:13px;margin:10px 0}.v2grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.fieldhint{font-size:10px;color:#6c8275}.workoutblock{padding:13px;border-radius:14px;background:#f0f7f1;margin:11px 0}.workoutblock .score{min-width:44px}.compactstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.compactstats .metric b{font-size:20px}.insight-title{font-size:11px;color:#74897c;font-weight:900;letter-spacing:.8px}.insight-note{background:#f1f6f2;color:#4d6a59;border-radius:10px;padding:10px;font-size:11px}.tap-card{border:1px solid #d7e5d9;background:white;border-radius:13px;padding:13px;width:100%;text-align:left;color:var(--ink)}.tap-card strong{display:block}.tap-card span{color:#71857a;font-size:11px}.pill.mutedpill{color:#657b6d;background:#eef3ef}.skilltags{display:flex;gap:6px;flex-wrap:wrap}.skilltags .pill{display:inline-flex;align-items:center}.analytics-empty{padding:16px;color:#6e8578;background:#f5f8f5;border-radius:12px;font-size:12px}.chipline{display:flex;gap:6px;align-items:center}.arrow{font-size:18px;color:#4b795f}.notice strong{font-weight:900}@media (max-width:420px){.v2grid{grid-template-columns:repeat(3,minmax(0,1fr))}.workoutblock{padding:10px}}

/* V3 Advanced Coaching Analytics */
.coach-section{border:1px solid #d6e9da;background:#f0f8f2;border-radius:14px;padding:14px;margin:12px 0}
.coach-section h3{margin:3px 0 7px}.coach-section .rnote{line-height:1.55}

</style></head><body><div class="header"><div class="headerin"><div class="brand"><div class="mark">🏀</div><div><strong>COACH HQ <span class="v3badge">V3.1</span></strong><small id="brand-team">Practice & analytics</small></div></div><button class="btn sm ghost" data-action="backup">↓ Backup</button></div></div><main class="shell" id="app"></main><nav class="tabbar"><div class="tabin" id="tabs"></div></nav><div id="toast" class="toast"></div><script>
(()=>{'use strict';
const KEY='coach_hq_local_v1';
const roster=[]; // Player names are intentionally not published in this app's public source.
const library=[['Defensive Footwork',3,'notes','Two full-court runs'],['Two-Line Layups + Outlets',9,'shots','Both sides and outlet passing'],['Ball Handling & Passing',8,'notes','Control the ball and pass accurately'],['SHOT! Box-Out Competition',9,'notes','Communicate, find, box, get'],['BREAK Press Break',16,'notes','Handle live pressure'],['HORNS Half-Court Offense',9,'notes','Spacing and timing'],['4-on-4 Scrimmage',16,'notes','Rotate players'],['Free Throws',5,'shots','10 attempts per player'],['Shooting Stations',10,'shots','Track made and attempted shots'],['Rebounding Battles',10,'notes','Box out and win possession'],['Transition Defense',8,'notes','Recover and communicate'],['Conditioning',8,'notes','Track reps and effort']];
library.push(...[["Form Shooting Drill",8,"shots","Record made and attempted form shots; add technique notes."],["King of the Court",12,"duels","Record one-on-one round wins and losses."],["CP3 Triangle Cone Drill",10,"cones","Record clean runs, errors, and optional best time."],["Protect the Ball Box Drill",8,"ball","Record successful ball protection and ball losses under pressure."],["Star Passing Drill",8,"passing","Record completed passes and passing errors."],["Mikan Finishing",8,"shots","Track made and attempted finishes."],["5-Spot Catch-and-Shoot",10,"shots","Track made and attempted shots at the five spots."],["3-Man Weave",9,"passing","Track completed passes and mistakes."],["Closeout and Contain",9,"stops","Track defensive stops and beaten reps."],["Shell Defense",12,"stops","Track defensive stops and breakdowns."],["2-on-1 Advantage Break",9,"notes","Observe decision-making and finishes."]]);
const EXTRA_SKILLS={"Form Shooting Drill":"Shooting","King of the Court":"Live Play","CP3 Triangle Cone Drill":"Ball Security","Protect the Ball Box Drill":"Ball Security","Star Passing Drill":"Team Offense","Mikan Finishing":"Finishing","5-Spot Catch-and-Shoot":"Shooting","3-Man Weave":"Team Offense","Closeout and Contain":"Defense","Shell Defense":"Defense","2-on-1 Advantage Break":"Team Offense"};
const TRACK_FIELDS={duels:['Wins','Losses'],cones:['Clean runs','Errors'],ball:['Protected reps','Ball losses'],passing:['Completed passes','Pass errors'],stops:['Defensive stops','Beaten reps']};
const SKILLS=['Shooting','Finishing','Ball Security','Defense','Rebounding','Team Offense','Live Play','Conditioning','Other','Uncategorized'];
const KNOWN_SKILLS={
 'Defensive Footwork':'Defense','Two-Line Layups + Outlets':'Finishing','Ball Handling & Passing':'Ball Security',
 'SHOT! Box-Out Competition':'Rebounding','BREAK Press Break':'Ball Security','HORNS Half-Court Offense':'Team Offense',
 '4-on-4 Scrimmage':'Live Play','Free Throws':'Shooting','Shooting Stations':'Shooting',
 'Rebounding Battles':'Rebounding','Transition Defense':'Defense','Conditioning':'Conditioning'};
function skillOf(d){return SKILLS.includes(d.category)?d.category:(KNOWN_SKILLS[d.name]||EXTRA_SKILLS[d.name]||'Uncategorized')}
function skillSelector(id,chosen){return `<select id="${id}">${SKILLS.map(x=>`<option ${x===chosen?'selected':''} value="${safe(x)}">${safe(x)}</option>`).join('')}</select>`;}
const uid=()=>Math.random().toString(36).slice(2,11);const iso=()=>{let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const drill=arr=>({id:uid(),name:arr[0],minutes:arr[1],type:arr[2],goal:arr[3],attempts:10,category:KNOWN_SKILLS[arr[0]]||EXTRA_SKILLS[arr[0]]||'Uncategorized'});
const initial=()=>({teams:[{id:'celtics',name:'Lemoore Celtics',players:roster.map(name=>({id:uid(),name}))}],teamId:'celtics',plans:[{id:'starter',teamId:'celtics',name:'Practice #3 — Fundamentals & Offense',date:iso(),drills:library.slice(0,8).map(drill)}],planId:'starter',sessions:[],active:null,tab:'home',recap:null});
let state;try{state=JSON.parse(localStorage.getItem(KEY))||initial()}catch{state=initial()}if(!state.teams||!state.plans||!state.sessions)state=initial();
if(!state.analyticsMode||state.analyticsMode==='team')state.analyticsMode='brief';if(!state.playerId)state.playerId='';if(!state.drillEditId)state.drillEditId='';if(!state.playerDrillFilter)state.playerDrillFilter='all';
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{toast('Storage unavailable: export a backup')}};
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const t=()=>state.teams.find(x=>x.id===state.teamId)||state.teams[0];
const plans=()=>state.plans.filter(x=>x.teamId===state.teamId);
const p=()=>plans().find(x=>x.id===state.planId)||plans()[0];
const hist=()=>state.sessions.filter(x=>x.teamId===state.teamId).slice().reverse();
const total=x=>x.drills.reduce((sum,d)=>sum+Number(d.minutes||0),0);
const bt=(label,action,css='',attrs='')=>`<button class="btn ${css}" data-action="${action}" ${attrs}>${label}</button>`;
const met=(value,label)=>`<div class="metric"><b>${safe(value)}</b><small>${safe(label)}</small></div>`;
const avat=n=>`<span class="avatar">${safe(n.trim().split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase())}</span>`;
const heading=(key,title,detail)=>`<div class="eyebrow">${key}</div><h1>${title}</h1><p class="muted">${detail}</p>`;
const empty=(a,b)=>`<div class="empty"><b>${a}</b><span class="small">${b}</span></div>`;
const details=(d,i,editable=false)=>`<div class="listrow"><span class="num">${String(i+1).padStart(2,'0')}</span><div class="grow"><strong>${safe(d.name)}</strong><div class="rnote">${d.minutes} min · ${safe(skillOf(d))} · ${d.type==='shots'?'Shooting':TRACK_FIELDS[d.type]?'Drill results':'Coach notes'} · ${Math.max(1,Number(d.rounds)||1)} ${Number(d.rounds)>1?'sets':'block'}</div><div class="rnote">${safe(d.goal||'')}${d.reps?' · '+safe(d.reps)+' reps':''}${d.restSeconds?' · '+safe(d.restSeconds)+'s rest':''}</div></div>${editable?`<div class="ctrls"><button class="choice" data-action="edit-drill" data-id="${d.id}" aria-label="Edit ${safe(d.name)}">✎</button><button class="choice" data-action="up" data-id="${d.id}" aria-label="Move up">↑</button><button class="choice" data-action="down" data-id="${d.id}" aria-label="Move down">↓</button><button class="choice" data-action="remove" data-id="${d.id}" aria-label="Remove drill">×</button></div>`:''}</div>`;

const tabs=[['home','⌂','Home'],['teams','♙','Teams'],['plans','▤','Plans'],['practice','▶','Practice'],['analytics','▥','Insights']];
function home(){let team=t(),selected=p(),done=hist();return `<div class="hero"><div class="eyebrow">COACH DASHBOARD</div><h1>${safe(team.name)}</h1><p>Your coaching command center.</p></div><div class="grid3">${met(team.players.length,'PLAYERS')}${met(done.length,'PRACTICES')}${met(state.active&&state.active.teamId===team.id?'LIVE':'—','STATUS')}</div><div class="section"><h3>Next practice</h3><span class="pill gold">READY</span></div><div class="card">${selected?`<h3>${safe(selected.name)}</h3><p class="muted small">${safe(selected.date)} · ${selected.drills.length} drills · ${total(selected)} minutes</p><div class="line"></div><div class="actions">${bt('Edit plan','edit-plan','outline')}${bt(state.active?'Resume practice':'Start practice →','start')}</div>`:empty('No practice plan yet','Create a plan to get started.')+bt('New plan','new-plan','full')}</div>${state.active&&state.active.teamId===team.id?`<div class="notice">You have an active session. Your changes are saved automatically.</div>`:''}${done.length?`<div class="section"><h3>Coach brief</h3><span class="pill">V3</span></div><div class="card"><h3>${safe(makeCoachBrief().items[0].title)}</h3><p class="small muted">${safe(makeCoachBrief().items[0].evidence)}</p>${bt('Open coaching brief →','coach-brief','outline full')}</div>`:''}<div class="section"><h3>Practice history</h3></div><div class="card">${done.length?done.slice(0,3).map(x=>`<div class="listrow"><span class="num">✓</span><div class="grow"><strong>${safe(x.title)}</strong><div class="rnote">${safe(x.date)} · ${x.doneCount}/${x.drillCount} drills</div></div></div>`).join('')+bt('View analytics','go-analytics','outline full'):empty('No completed practices','Your first completed practice will appear here.')}</div><div class="note">Practice data stays in this browser on this device. Use Backup regularly; cloud sync and coach accounts are not yet included.</div>`;}
function teams(){let team=t();return heading('TEAM ROSTER','My Teams','Manage your coaching rosters.')+`<label class="field">Current team</label><select id="team-select">${state.teams.map(x=>`<option value="${x.id}" ${x.id===team.id?'selected':''}>${safe(x.name)}</option>`).join('')}</select><div class="section"><h3>Players</h3><span class="pill">${team.players.length} rostered</span></div><div class="card">${team.players.length?team.players.map(x=>`<div class="listrow">${avat(x.name)}<div class="grow"><strong>${safe(x.name)}</strong></div><button class="btn sm warn" data-action="delete-player" data-id="${x.id}">Remove</button></div>`).join(''):empty('No players','Add your roster below.')}</div><div class="card"><h3>Add players</h3><p class="muted small">Paste names one per line. Existing names won't be duplicated.</p><textarea id="roster-add" placeholder="First Last&#10;First Last"></textarea>${bt('Add roster names','add-roster','full')}<div class="line"></div><label class="field">New team</label><div class="row"><input id="team-add" placeholder="Team name">${bt('Create','create-team')}</div></div>`;}
function plansPage(){
 const selected=p();let out=heading('WORKOUT-STYLE BUILDER','Practice Plans','Plan time, sets, repetitions, recovery and coaching objectives.');
 out+=`<div class="row"><select id="plan-select" style="flex:1">${plans().map(x=>`<option value="${safe(x.id)}" ${x.id===selected?.id?'selected':''}>${safe(x.name)}</option>`).join('')}</select>${bt('+ New','new-plan','sm')}</div>`;
 if(!selected)return out+`<div class="card">${empty('No plans yet','Create a plan for your next team practice.')}</div>`;
 out+=`<div class="card"><label class="field">Practice name</label><input id="plan-name" value="${safe(selected.name)}"><label class="field">Scheduled date</label><input type="date" id="plan-date" value="${safe(selected.date)}"><div class="actions" style="margin-top:10px">${bt('Save details','save-plan','outline')}${bt('Duplicate','duplicate','ghost')}${bt('Delete','delete-plan','warn')}</div></div>`;
 out+=`<div class="section"><h3>Workout sequence</h3><span class="pill">${selected.drills.length} drills · ${total(selected)} min</span></div><div class="card">${selected.drills.length?selected.drills.map((d,i)=>details(d,i,true)).join(''):empty('No drills','Choose a drill or a ready-made template below.')}</div>`;
 let editing=selected.drills.find(d=>d.id===state.drillEditId);

}else if(TRACK_FIELDS[d.type]){display+=trackedPanel(d,r,team,a);}else{display+=`<p class="muted small">Optional observations. Tap a player to log a positive or a coaching focus.</p>`+team.players.filter(x=>a.attendance[x.id]!=='out'&&a.attendance[x.id]!=='excused').map(x=>{let mark=r.marks[x.id];return `<div class="listrow">${avat(x.name)}<div class="grow"><strong>${safe(x.name.split(' ')[0])}</strong></div><div class="ctrls"><button class="choice ${mark==='good'?'on':''}" data-action="mark" data-id="${x.id}" data-value="good">+ Good</button><button class="choice out ${mark==='focus'?'on':''}" data-action="mark" data-id="${x.id}" data-value="focus">Focus</button></div></div>`}).join('');}

function sessionAttendance(s){const vals=Object.values(s.attendance||{}),eligible=vals.length?vals.filter(x=>x!=='excused').length:(Number(s.roster)||0),present=vals.length?vals.filter(x=>x==='here'||x==='late').length:(Number(s.present)||0);return {eligible,present};}
function coachingData(){let done=hist(),team=t(),players={};team.players.forEach(x=>players[x.id]={player:x,made:0,attempts:0,good:0,focus:0,attended:0,eligible:0,trend:[],shots:0});let totalDone=0,totalDrills=0,totalSeconds=0,visits=0,eligible=0,shots=0,made=0,coverage=0,drills={};const attendanceTrend=[];
 done.slice().reverse().forEach(sess=>{let a=sessionAttendance(sess);visits+=a.present;eligible+=a.eligible;attendanceTrend.push({date:sess.date,present:a.present,eligible:a.eligible});totalDone+=Number(sess.doneCount)||0;totalDrills+=Number(sess.drillCount)||sess.drills.length;
 Object.values(players).forEach(o=>{let st=sess.attendance?.[o.player.id];if(st&&st!=='excused'){o.eligible++;if(st==='here'||st==='late')o.attended++}});
 sess.drills.forEach(d=>{let r=sess.records?.[d.id]||{},k=d.name||'Drill';if(!drills[k])drills[k]={name:k,planned:0,actual:0,uses:0};drills[k].planned+=(Number(d.minutes)||0);drills[k].actual+=(Number(r.seconds)||0);drills[k].uses++;totalSeconds+=(Number(r.seconds)||0);
 Object.entries(r.scores||{}).forEach(([id,v])=>{let m=Number(v.made)||0,at=Number(v.attempts)||0;if(!at)return;made+=m;shots+=at;coverage++;if(players[id]){players[id].made+=m;players[id].attempts+=at;players[id].shots++;players[id].trend.push({date:sess.date,name:d.name,made:m,attempts:at});}});
 Object.entries(r.marks||{}).forEach(([id,val])=>{if(players[id]&&val==='good')players[id].good++;if(players[id]&&val==='focus')players[id].focus++;});});});
 return {done,players,totalDone,totalDrills,totalSeconds,visits,eligible,shots,made,coverage,drills:Object.values(drills).sort((a,b)=>b.planned-a.planned),attendanceTrend};}
function percent(a,b){return b?Math.round(100*a/b)+'%':'—';}
function progress(label,value,denom,meta='',kind=''){return `<div class="trendrow"><div class="trendlabel"><span>${safe(label)}</span><strong>${denom?percent(value,denom):'—'} ${safe(meta)}</strong></div><div class="miniBar ${kind}"><i style="width:${denom?Math.min(100,Math.max(0,100*value/denom)):0}%"></i></div></div>`;}

function chronologicalSessions(){return hist().map((s,i)=>({s,i})).sort((a,b)=>String(a.s.date||'').localeCompare(String(b.s.date||''))||b.i-a.i).map(x=>x.s)}
function completedSkillMix(inputSessions){let bySkill={},totalPlanned=0,totalTimed=0,totalBlocks=0;
 inputSessions.forEach(sess=>(sess.drills||[]).forEach(d=>{let r=sess.records?.[d.id]||{};if(!r.done)return;
 const key=skillOf(d),n=Math.max(0,Number(d.minutes)||0),seconds=Math.max(0,Number(r.seconds)||0);
 if(!bySkill[key])bySkill[key]={skill:key,planned:0,timed:0,blocks:0};
 bySkill[key].planned+=n;bySkill[key].timed+=seconds;bySkill[key].blocks++;totalPlanned+=n;totalTimed+=seconds;totalBlocks++}));
 return {rows:Object.values(bySkill).sort((a,b)=>b.planned-a.planned),totalPlanned,totalTimed,totalBlocks};}
function sessionShotEvidence(inputSessions){let byDrill={};inputSessions.forEach((s,idx)=>(s.drills||[]).forEach(d=>{let r=s.records?.[d.id]||{},made=0,attempts=0;
 Object.values(r.scores||{}).forEach(v=>{if(Number(v.attempts)>0&&Number(v.made)>=0&&Number(v.made)<=Number(v.attempts)){made+=Number(v.made);attempts+=Number(v.attempts)}});
 if(!attempts)return;let k=String(d.name||'Unnamed drill');if(!byDrill[k])byDrill[k]=[];
 byDrill[k].push({date:s.date||'',sessionId:s.id,index:idx,made,attempts});}));
 return byDrill;}
function evidenceNote(type,title,evidence,action){return {type,title,evidence,action};}
function makeCoachBrief(){const last=chronologicalSessions().slice(-3),mix=completedSkillMix(last),shots=sessionShotEvidence(last),items=[];
 if(!last.length)return {last,mix,items:[evidenceNote('setup','Record your first coaching baseline','No completed sessions yet. A baseline needs recorded attempts, observations, and a saved practice.','Start with a short skill challenge and record makes/attempts.')],shotGroups:shots};
 // Same-drill comparisons only; both sessions require a minimum of 10 entered attempts.
 const candidates=Object.entries(shots).flatMap(([name,rows])=>{let series=rows.filter(r=>r.attempts>=10);if(series.length<2)return [];
 let a=series[series.length-2],b=series[series.length-1];if(a.sessionId===b.sessionId)return [];
 const delta=100*b.made/b.attempts-100*a.made/a.attempts;return [{name,a,b,delta}];}).sort((a,b)=>a.delta-b.delta);
 if(candidates.length&&Math.round(candidates[0].delta)<=-10){let c=candidates[0];items.push(evidenceNote('trend','Review '+c.name+' consistency',`${c.a.made}/${c.a.attempts} to ${c.b.made}/${c.b.attempts} across two recorded practices (−${Math.round(-c.delta)} percentage points). Small samples can fluctuate.`,`Repeat the same ${c.name} challenge with comparable attempts.`));}
 // Only count focus flags from completed drills in the last three sessions; not player diagnoses.
 let focusBySkill={};last.forEach(sess=>(sess.drills||[]).forEach(d=>{let r=sess.records?.[d.id]||{};if(!r.done)return;let count=Object.values(r.marks||{}).filter(v=>v==='focus').length;if(!count)return;let k=skillOf(d);if(!focusBySkill[k])focusBySkill[k]={count:0,sessions:new Set()};focusBySkill[k].count+=count;focusBySkill[k].sessions.add(sess.id);}));
 const repeated=Object.entries(focusBySkill).filter(([k,v])=>v.sessions.size>=2&&v.count>=2).sort((a,b)=>b[1].count-a[1].count);
 if(repeated.length){let [area,v]=repeated[0];items.push(evidenceNote('observations','Revisit '+area+' coaching points',`${v.count} focus observations were entered during completed ${area} drills across ${v.sessions.size} practices. These are coach notes, not skill ratings.`,`Add a ${area} drill and record a specific measurable result.`));}
 if(candidates.length){let positives=candidates.filter(c=>c.delta>=10).sort((a,b)=>b.delta-a.delta);
 if(positives.length){let c=positives[0];items.push(evidenceNote('progress','Recheck '+c.name+' progress',`${c.a.made}/${c.a.attempts} to ${c.b.made}/${c.b.attempts} in matched drill records (+${Math.round(c.delta)} percentage points). This is an observed change, not proof of lasting improvement.`,`Repeat the drill to confirm the trend.`));}}
 if(mix.rows.length){let main=mix.rows[0];items.push(evidenceNote('workload','Review your practice balance',`${main.skill} accounts for ${main.planned} of ${mix.totalPlanned} scheduled minutes in completed drill blocks over the last ${last.length} practice${last.length===1?'':'s'}.`,`Compare the skill mix with your next game or development goals.`));}
 let comparable=Object.values(shots).some(rows=>new Set(rows.map(r=>r.sessionId)).size>=2);
 if(!comparable){items.push(evidenceNote('baseline','Collect comparable shooting samples','There are not yet shooting results from the same named drill across two practices. Different shot drills should not be pooled into a trend.','Repeat one shooting drill next practice and enter makes/attempts.'));}
 if(!mix.totalBlocks){items.push(evidenceNote('coverage','Complete and log your drills','Your recent sessions do not contain completed drill blocks; scheduled plans alone do not establish actual training workload.','Mark drills complete during the next practice.'));}
 if(items.length<2)items.push(evidenceNote('planning','Plan a measurable next practice',`${last.length} saved practice${last.length===1?'':'s'} reviewed. Specific shooting and focus suggestions appear when repeated evidence is available.`,'Choose one repeatable benchmark for the next session.'));
 return {last,mix,items:items.slice(0,4),shotGroups:shots};}
function briefPage(){const brief=makeCoachBrief();let out='<div class="coach-section"><strong>COACH BRIEF · LAST '+brief.last.length+' PRACTICE'+(brief.last.length===1?'':'S')+'</strong><p class="small muted">Evidence-based coaching prompts. This is not an AI prediction, a player grade, or a claim of causation.</p></div>';
 out+='<div class="section"><h3>Next practice priorities</h3><span class="pill">REVIEW</span></div>';

 out+=`<div class="coach-brief-actions">${bt('Open practice builder →','edit-plan','outline')}${bt('See team data','analytics-team','ghost')}</div>`;
 out+='<div class="section"><h3>Recent completed-drill workload</h3></div><div class="card">';
 const mix=brief.mix;if(!mix.totalPlanned)out+=empty('No completed drill minutes','Finish a drill to include it in the workload breakdown.');
 else out+=`<p class="small muted">${mix.totalPlanned} scheduled minutes in ${mix.totalBlocks} completed drill blocks. Timers logged ${Math.round(mix.totalTimed/60)} minutes separately.</p>`+mix.rows.map(x=>focusBar(x.skill,x.planned,mix.totalPlanned)).join('');
 out+='</div><div class="note">Older named library drills are categorized by their known drill names. Custom or unmatched drills appear as Uncategorized until you assign a skill area in Plans. Suggestions use the last three saved sessions only.</div>';return out;}
function focusBar(name,minutes,total){return `<div class="focus-table"><span class="focus-label">${safe(name)}</span><div class="focus-meter"><div style="width:${total?100*minutes/total:0}%"></div></div><span class="focus-min">${minutes}m</span></div>`}
function individualAnalysis(selected){let events=selected.trend.slice().reverse();let names=[...new Set(events.map(e=>e.name))].sort();let selectedName=state.playerDrillFilter==='all'?'all':names.includes(state.playerDrillFilter)?state.playerDrillFilter:'all';
 let items=selectedName==='all'?events:events.filter(x=>x.name===selectedName);
 let out='<div class="section"><h3>Comparable shooting trends</h3></div><div class="card"><p class="muted small">Use one drill at a time to track change. Rates reflect only entered attempts.</p><label class="field">Drill filter</label><select id="player-drill-filter"><option value="all" '+(selectedName==='all'?'selected':'')+'>All recorded drills (no combined trend)</option>'+names.map(n=>`<option value="${safe(n)}" ${selectedName===n?'selected':''}>${safe(n)}</option>`).join('')+'</select>';
 if(selectedName!=='all'){let sameChrono=selected.trend.filter(x=>x.name===selectedName);let n=sameChrono.length;if(n>=2){let a=sameChrono[n-2],b=sameChrono[n-1];let d=100*b.made/b.attempts-100*a.made/a.attempts;
 if(a.attempts>=5&&b.attempts>=5){out+=`<div class="coach-section"><strong>Most recent two results: ${d>0?'+':''}${Math.round(d)} percentage points</strong><div class="rnote">${a.made}/${a.attempts} on ${safe(a.date)} → ${b.made}/${b.attempts} on ${safe(b.date)}. Descriptive change only; small samples fluctuate.</div></div>`;}else out+='<div class="notice">Two drill entries exist, but both need at least five attempts before showing a comparison.</div>';}else out+='<div class="notice">Add another session with this same drill to see a comparison.</div>';}
 out+=items.length?items.map(e=>progress(`${e.date} · ${e.name}`,e.made,e.attempts,`(${e.made}/${e.attempts})`)).join(''):empty('No shooting records','Log shots during a completed practice.');
 if(selectedName==='all'&&names.length>1)out+='<p class="rnote">Different shooting drills are displayed separately. Select a drill to compare like-for-like results.</p>';
 out+='</div>';return out;}
function individualObservationLog(selected){let events=[];chronologicalSessions().forEach(sess=>(sess.drills||[]).forEach(d=>{let r=sess.records?.[d.id]||{},mark=r.marks?.[selected.player.id];if(mark==='focus'||mark==='good')events.push({date:sess.date,drill:d.name,mark});}));
 let out='<div class="section"><h3>Coach observations</h3></div><div class="card">';
 out+=events.length?events.slice(-10).reverse().map(e=>`<div class="note-record"><span class="chipbox ${e.mark==='focus'?'focus':''}">${e.mark==='focus'?'Focus note':'Positive note'}</span><strong class="small" style="margin-left:7px">${safe(e.drill)}</strong><div class="rnote">${safe(e.date)}</div></div>`).join(''):empty('No individual observations','Use Good or Focus during a live drill to record coaching notes.');
 out+='</div><div class="note">These are private coach observations—not diagnoses, rankings, or objective skill measurements. Use a consistent drill to compare performance.</div>';return out;}

function analytics(){const data=coachingData(),team=t(),done=data.done;let mode=state.analyticsMode||'team';let out=heading('PLAYER & TEAM INTELLIGENCE','Coaching Analytics','Real trends from recorded practice results — no invented ratings.');
 out+=`<div class="subtabs"><button class="${mode==='brief'?'active':''}" data-action="analytics-brief">Coach brief</button><button class="${mode==='team'?'active':''}" data-action="analytics-team">Team overview</button><button class="${mode==='players'?'active':''}" data-action="analytics-players">Player development</button><button class="${mode==='history'?'active':''}" data-action="analytics-history">Practice history</button></div>`;
 if(mode==='brief'){out+=briefPage();}else if(mode==='team'){
 out+=`<div class="grid3">${met(done.length,'PRACTICES')}${met(percent(data.visits,data.eligible),'ATTENDANCE')}${met(percent(data.totalDone,data.totalDrills),'COMPLETION')}</div><div class="section"><h3>Team shooting</h3><span class="pill">RECORDED ONLY</span></div><div class="card"><div class="row"><div><div class="insight-title">TEAM MAKES / ATTEMPTS</div><h1>${data.shots?percent(data.made,data.shots):'—'}</h1><div class="rnote">${data.made} made / ${data.shots} attempts · ${data.coverage} recorded player-drill results</div></div><span class="pill">${data.shots?'VERIFIED':'NO DATA'}</span></div>${progress('Shooting percentage',data.made,data.shots)}</div>`;
 out+=`<div class="section"><h3>Attendance by practice</h3></div><div class="card">${data.attendanceTrend.length?data.attendanceTrend.slice(0,8).reverse().map(a=>progress(a.date,a.present,a.eligible,`(${a.present}/${a.eligible})`)).join(''):empty('Not enough practices','Save a session to see attendance trends.')}</div>`;
 out+=`<div class="section"><h3>Practice time & focus</h3></div><div class="card"><div class="grid2">${met(Math.round(data.totalSeconds/60)+' min','TIMER LOGGED')}${met(data.drills.length,'UNIQUE DRILLS')}</div><p class="muted small">Your most-used drills by scheduled practice minutes (not a measure of individual performance):</p>${data.drills.length?data.drills.slice(0,6).map(d=>progress(d.name,d.planned,Math.max(1,Math.max(...data.drills.map(x=>x.planned))),`· ${d.uses} sessions`)).join(''):empty('No practice history','Finish a practice to see drill usage.')}</div>`;
 out+=trackedTeam();const teamMix=completedSkillMix(chronologicalSessions());out+=`<div class="section"><h3>Skill-area workload</h3></div><div class="card"><p class="muted small">Scheduled minutes from completed drill blocks only, across saved practices. Actual timer minutes are separate.</p>${teamMix.rows.length?teamMix.rows.map(x=>focusBar(x.skill,x.planned,teamMix.totalPlanned)).join(''):empty('No completed drills','Mark drills complete to see their training areas.')}</div>`;
 out+=`<div class="note">Practice timer minutes only count when the timer was running. Planned minutes are not treated as actual practice time. Shooting percentages are drill-specific and reflect only entered results.</div>`;
 }else if(mode==='players'){
 if(!team.players.length)out+='<div class="card">'+empty('No players','Add a roster on the Teams tab first.')+'</div>';
 else{let selected=data.players[state.playerId]||data.players[team.players[0].id],person=selected.player;out+=`<div class="card"><label class="field">Select player</label><select id="player-select">${team.players.map(x=>`<option value="${safe(x.id)}" ${x.id===person.id?'selected':''}>${safe(x.name)}</option>`).join('')}</select></div><div class="card"><div class="profile-head">${avat(person.name)}<div class="grow"><h2>${safe(person.name)}</h2><div class="rnote">Development record · ${safe(team.name)}</div></div></div><div class="line"></div><div class="grid3">${met(percent(selected.attended,selected.eligible),'ATTENDED')}${met(percent(selected.made,selected.attempts),'SHOOTING')}${met(selected.shots,'SHOT LOGS')}</div><div class="line"></div><div class="grid2">${met(selected.good,'POSITIVE NOTES')}${met(selected.focus,'FOCUS NOTES')}</div></div>`;
 
 out+=individualAnalysis(selected)+trackedInsights(person.id)+individualObservationLog(selected);
 }
 }else{
 out+=`<div class="section"><h3>Saved practices</h3><span class="pill">${done.length} SESSIONS</span></div>`;
 out+=done.length?done.map(x=>{let a=sessionAttendance(x);return `<div class="card"><div class="row"><div class="grow"><h3>${safe(x.title)}</h3><div class="rnote">${safe(x.date)} · ${a.present}/${a.eligible} present</div></div><span class="pill">${x.doneCount}/${x.drillCount} drills</span></div><div class="actions" style="margin-top:12px">${bt('View recap','recap','outline sm',`data-id="${x.id}"`)}${bt('Delete','delete-session','warn sm',`data-id="${x.id}"`)}</div>${state.recap===x.id?recapView(x):''}</div>`;}).join(''):`<div class="card">${empty('No saved practices','Finish a session to build your practice history.')}</div>`;
 }
 out+=`<div class="section"><h3>Export & restore</h3></div><div class="card"><div class="actions">${bt('Export backup','backup','ghost')}${bt('Export CSV','csv','outline')}</div><label class="field">Restore a Coach HQ backup</label><input type="file" id="restore" accept=".json,application/json"><p class="muted xs">Restoring replaces this device's records. Export a backup first. V1 backups are supported.</p></div>`;
 return out;
}

function recapView(x){return `<div class="line"></div><div class="tag">PRACTICE RECAP</div><p class="muted small">${safe(x.completedAt)}</p>${x.coachSummary?`<div class="coach-section"><strong>Coach takeaway</strong><p class="small">${safe(x.coachSummary)}</p></div>`:''}`+x.drills.map(d=>{let r=x.records[d.id]||{};return `<div class="listrow"><span class="num">${r.done?'✓':'—'}</span><div class="grow"><strong>${safe(d.name)}</strong><div class="rnote">${clock(r.seconds||0)} tracked · ${r.roundsDone||0}/${d.rounds||1} sets · ${Object.keys(r.scores||{}).length} scores · ${Object.keys(r.marks||{}).length} observations · ${Object.keys(r.metrics||{}).length} tracked players</div>${r.note?`<div class="rnote">${safe(r.note)}</div>`:''}</div></div>`}).join('');}
function render(){let el=document.getElementById('app');if(!t())return;document.getElementById('brand-team').textContent=t().name;document.getElementById('tabs').innerHTML=tabs.map(([key,icon,name])=>`<button class="${state.tab===key?'on':''}" data-tab="${key}"><span>${icon}</span>${name}</button>`).join('');el.innerHTML=({home,teams,plans:plansPage,practice,analytics})[state.tab]()+`<div class="footer">V3.1 · Drill-specific results · Local-only coaching records · Export a backup after every practice</div>`;updateClock();}
function updateClock(){let e=document.getElementById('clock');if(e&&state.active?.phase==='drills'){e.textContent=clock(elapsed(state.active.drills[state.active.current]))}}
function toast(message){let e=document.getElementById('toast');e.textContent=message;e.style.display='block';clearTimeout(window.toastTimeout);window.toastTimeout=setTimeout(()=>e.style.display='none',2400)}
const go=x=>{state.tab=x;save();render();scrollTo(0,0)};
function persistSessionSummary(){let e=document.getElementById('session-summary');if(e&&state.active){state.active.coachSummary=e.value;save()}}
function persistNote(){let e=document.getElementById('note');if(e&&state.active?.phase==='drills'){rec(state.active.drills[state.active.current]).note=e.value;save()}}
function getScore(pid,step){let d=state.active.drills[state.active.current],r=rec(d),v=r.scores[pid];if(!v&&step==='minus')return;if(!v)v={made:0,attempts:Math.max(1,Number(d.attempts)||10)};if(step==='plus')v.made=Math.min(v.attempts,v.made+1);if(step==='minus')v.made=Math.max(0,v.made-1);r.scores[pid]=v;save();render()}
function download(content,filename,type){let url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),500)}
function act(action,node){let team=t(),selected=p(),a=state.active,pid=node.dataset.id||'';switch(action){
case 'backup':download(JSON.stringify(state,null,2),`coach-hq-backup-${iso()}.json`,'application/json');toast('Backup downloaded');break;
case 'edit-plan':go('plans');break;case 'go-analytics':go('analytics');break;case 'coach-brief':state.analyticsMode='brief';go('analytics');break;
case 'add-roster':{let names=document.getElementById('roster-add').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);let added=0;names.forEach(name=>{if(!team.players.some(p=>p.name.toLowerCase()===name.toLowerCase())){team.players.push({id:uid(),name});added++}});save();render();toast(added+' players added');break;}
case 'delete-player':if(confirm('Remove this player from the roster?')){team.players=team.players.filter(x=>x.id!==pid);save();render()}break;
case 'create-team':{let n=document.getElementById('team-add').value.trim();if(!n)break;let id=uid();state.teams.push({id,name:n,players:[]});state.teamId=id;state.planId='';save();render();toast('Team created');break;}
case 'new-plan':{let x={id:uid(),teamId:state.teamId,name:'New Practice',date:iso(),drills:[]};state.plans.push(x);state.planId=x.id;go('plans');break;}
case 'save-plan':selected.name=document.getElementById('plan-name').value.trim()||selected.name;selected.date=document.getElementById('plan-date').value||iso();save();render();toast('Plan saved');break;
case 'duplicate':{let copy=JSON.parse(JSON.stringify(selected));copy.id=uid();copy.name+=' (Copy)';copy.drills.forEach(x=>x.id=uid());state.plans.push(copy);state.planId=copy.id;save();render();toast('Plan duplicated');break;}
case 'delete-plan':if(confirm('Delete this plan? Previously completed sessions remain.')){state.plans=state.plans.filter(x=>x.id!==selected.id);state.planId=plans()[0]?.id;save();render()}break;
case 'up':case 'down':{let i=selected.drills.findIndex(x=>x.id===pid),j=i+(action==='up'?-1:1);if(i>=0&&j>=0&&j<selected.drills.length){[selected.drills[i],selected.drills[j]]=[selected.drills[j],selected.drills[i]];save();render()}break;}
case 'remove':selected.drills=selected.drills.filter(x=>x.id!==pid);save();render();break;
case 'add-library':selected.drills.push(drill(library[Number(document.getElementById('library-select').value)]));save();render();toast('Drill added');break;
case 'add-custom':{let n=document.getElementById('custom-name').value.trim();if(!n)return toast('Enter a drill name');selected.drills.push({id:uid(),name:n,minutes:Math.max(1,Number(document.getElementById('custom-minutes').value)||10),type:document.getElementById('custom-type').value,goal:document.getElementById('custom-goal').value.trim(),attempts:10,category:document.getElementById('custom-category').value});save();render();toast('Custom drill added');break;}
case 'analytics-brief':state.analyticsMode='brief';save();render();break;
case 'analytics-team':state.analyticsMode='team';save();render();break;
case 'analytics-players':state.analyticsMode='players';save();render();break;
case 'analytics-history':state.analyticsMode='history';save();render();break;
case 'edit-drill':state.drillEditId=pid;save();render();break;
case 'cancel-edit':state.drillEditId='';save();render();break;
case 'save-drill':{
let d=selected?.drills.find(x=>x.id===state.drillEditId);if(!d)return;
d.name=document.getElementById('edit-name').value.trim()||d.name;
d.goal=document.getElementById('edit-goal').value.trim();
d.minutes=Math.min(180,Math.max(1,Number(document.getElementById('edit-min').value)||10));
d.rounds=Math.min(50,Math.max(1,Number(document.getElementById('edit-rounds').value)||1));
d.reps=Math.min(500,Math.max(0,Number(document.getElementById('edit-reps').value)||0));
d.restSeconds=Math.min(600,Math.max(0,Number(document.getElementById('edit-rest').value)||0));
d.type=document.getElementById('edit-type').value;d.category=document.getElementById('edit-category').value;
state.drillEditId='';save();render();toast('Drill updated');break;}
case 'template-shooting':case 'template-defense':case 'template-game':{
let index=action==='template-shooting'?[7,8,1,2]:action==='template-defense'?[0,3,9,10]:[0,1,4,5,6,7];
if(selected.drills.length&&!confirm('Replace the drills in this practice plan with the template? Saved past practices will not change.'))break;
selected.drills=index.map(i=>drill(library[i]));save();render();toast('Workout template applied');break;}
case 'round-plus':case 'round-minus':{
let d=a.drills[a.current],r=rec(d),limit=Math.max(1,Number(d.rounds)||1);r.roundsDone=Math.min(limit,Math.max(0,(Number(r.roundsDone)||0)+(action==='round-plus'?1:-1)));save();render();break;}
case 'start':if(a&&a.teamId===team.id){go('practice');break;}if(!selected?.drills.length){toast('Add drills to a plan first');go('plans');break;}if(!team.players.length){toast('Add your roster first');go('teams');break;}state.active={id:uid(),teamId:state.teamId,title:selected.name,date:iso(),drills:JSON.parse(JSON.stringify(selected.drills)),attendance:{},phase:'attendance',records:{},current:0,startedAt:new Date().toISOString()};go('practice');break;
case 'all-here':team.players.forEach(x=>a.attendance[x.id]='here');save();render();break;
case 'attendance':a.attendance[pid]=node.dataset.value;save();render();break;
case 'confirm-attendance':if(team.players.some(x=>!a.attendance[x.id]))return toast('Mark every player');a.phase='drills';save();render();break;
case 'edit-attendance':persistNote();stop(a.drills[a.current]);a.phase='attendance';save();render();break;
case 'timer':{let r=rec(a.drills[a.current]);if(r.running)stop(a.drills[a.current]);else{r.running=true;r.startedAt=Date.now()}save();render();break;}
case 'metric-first':case 'metric-second':{if(!a||a.phase!=='drills')break;let d=a.drills[a.current],r=rec(d);if(!TRACK_FIELDS[d.type])break;let v=metricOf(r,pid),f=action==='metric-first'?'first':'second';v[f]=Math.min(9999,(Number(v[f])||0)+1);r.metricHistory.push({pid,f});save();render();break;}
case 'metric-undo':{if(!a||a.phase!=='drills')break;let r=rec(a.drills[a.current]),idx=r.metricHistory.map(e=>e.pid).lastIndexOf(pid);if(idx<0)break;let e=r.metricHistory.splice(idx,1)[0],v=metricOf(r,pid);v[e.f]=Math.max(0,(Number(v[e.f])||0)-1);save();render();break;}
case 'plus':case 'minus':case 'zero':getScore(pid,action);break;
case 'mark':{let r=rec(a.drills[a.current]),v=node.dataset.value;r.marks[pid]=r.marks[pid]===v?'':v;save();render();break;}
case 'save-note':persistNote();toast('Note saved');break;
case 'complete':persistNote();stop(a.drills[a.current]);rec(a.drills[a.current]).done=!rec(a.drills[a.current]).done;save();render();toast('Drill updated');break;
case 'previous':case 'next':persistNote();stop(a.drills[a.current]);a.current=Math.max(0,Math.min(a.drills.length-1,a.current+(action==='previous'?-1:1)));save();render();scrollTo(0,0);break;
case 'jump':persistNote();stop(a.drills[a.current]);a.current=Number(node.dataset.index);save();render();scrollTo(0,0);break;
case 'finish':{persistSessionSummary();persistNote();stop(a.drills[a.current]);if(!confirm('Finish this practice and save a recap?'))break;let count=a.drills.filter(d=>a.records[d.id]?.done).length;state.sessions.push({id:a.id,teamId:a.teamId,title:a.title,date:a.date,completedAt:new Date().toLocaleString(),roster:team.players.length,present:activePresent(),attendance:a.attendance,coachSummary:a.coachSummary||'',drills:a.drills,records:a.records,doneCount:count,drillCount:a.drills.length});state.recap=a.id;state.active=null;state.analyticsMode='history';go('analytics');toast('Practice saved');break;}
case 'recap':state.recap=state.recap===pid?null:pid;save();render();break;
case 'delete-session':if(confirm('Delete this saved practice from the device?')){state.sessions=state.sessions.filter(x=>x.id!==pid);save();render()}break;
case 'csv':{let rows=[['date','practice','drill','player','made','attempts','observation','completed']];hist().forEach(s=>s.drills.forEach(d=>{let r=s.records[d.id]||{},ids=[...new Set([...Object.keys(r.scores||{}),...Object.keys(r.marks||{})])];if(!ids.length)rows.push([s.date,s.title,d.name,'','','',r.note||'',r.done||false]);else ids.forEach(id=>{let pl=team.players.find(x=>x.id===id),v=r.scores?.[id];rows.push([s.date,s.title,d.name,pl?.name||id,v?.made??'',v?.attempts??'',r.marks?.[id]||r.note||'',r.done||false])})}));download(rows.map(row=>row.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\r\n'),`coach-hq-results-${iso()}.csv`,'text/csv');toast('CSV downloaded');break;}
}}
document.addEventListener('click',e=>{let tab=e.target.closest('[data-tab]');if(tab){persistSessionSummary();persistNote();go(tab.dataset.tab);return;}let node=e.target.closest('[data-action]');if(node)act(node.dataset.action,node)});
document.addEventListener('change',e=>{let el=e.target;if(el.id==='team-select'){state.teamId=el.value;state.planId=plans()[0]?.id;save();render()}if(el.id==='plan-select'){state.planId=el.value;state.drillEditId='';save();render()}if(el.id==='player-select'){state.playerId=el.value;state.playerDrillFilter='all';save();render()}if(el.id==='player-drill-filter'){state.playerDrillFilter=el.value;save();render()}if(el.classList.contains('metric-time')&&state.active?.phase==='drills'){let r=rec(state.active.drills[state.active.current]),v=metricOf(r,el.dataset.id),n=el.value===''?null:Number(el.value);if(n!==null&&(!Number.isFinite(n)||n<=0||n>3600)){toast('Enter a time between 0 and 3600 seconds');return;}v.bestSeconds=n;save();render();}
if(el.id==='attempt-target'&&state.active?.phase==='drills'){state.active.drills[state.active.current].attempts=Math.max(1,Math.min(100,Number(el.value)||10));save();toast('Attempt target updated')}if(el.id==='restore'&&el.files?.[0]){let reader=new FileReader();reader.onload=()=>{try{let obj=JSON.parse(reader.result);if(!Array.isArray(obj.teams)||!Array.isArray(obj.plans)||!Array.isArray(obj.sessions))throw Error('invalid');if(!confirm('Restore backup? This replaces everything stored on this device.'))return;state=obj;save();render();toast('Backup restored')}catch{toast('Backup file was not valid')}};reader.readAsText(el.files[0])}});
document.addEventListener('input',e=>{if(e.target.id==='note')persistNote();if(e.target.id==='session-summary')persistSessionSummary()});window.addEventListener('beforeunload',save);setInterval(updateClock,1000);render();
})();
</script></body></html>
